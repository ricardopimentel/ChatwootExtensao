<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Permissão de Microfone - Chatwoot Helper</title>
  <style>
    body {
      background-color: #121824;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      background-color: #1a2235;
      border: 1px solid #2e3a59;
      border-radius: 12px;
      padding: 30px;
      max-width: 400px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }
    .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 12px;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🎙️</div>
    <h1>Permissão de Microfone</h1>
    <p>Para enviar mensagens de voz, precisamos de permissão para usar seu microfone. Por favor, clique no botão abaixo e confirme o acesso no navegador.</p>
    <button id="btn-request" class="btn">Permitir Microfone</button>
  </div>
  <script src="permission.js"></script>
</body>
</html>
